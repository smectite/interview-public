server.port=8080

spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

app.data-dir=data
app.max-upload-size=104857600
#app.startup-check=false

# Process-local, globally shared limiter; restart to select a different approach.
app.rate-limit.approach=LAZY_DRAINING
app.rate-limit.capacity=10
app.rate-limit.requests=10
app.rate-limit.period=60s
app.rate-limit.queue-timeout=6s
