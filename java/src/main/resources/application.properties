server.port=8080

spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

app.data-dir=data
app.max-upload-size=104857600

# One process-local lazy-draining bucket shared by all clients and routes.
app.rate-limit.capacity=10
app.rate-limit.requests=10
app.rate-limit.period=60s
